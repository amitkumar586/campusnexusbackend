spring.application.name=campulsebackend

# Optional machine-local overrides (git-ignored): DB password, profile, JWT secret. See local.properties.
spring.config.import=optional:file:./local.properties
server.port=${SERVER_PORT:8080}

# Database (override with environment variables; never commit real credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campulse?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JWT. JWT_SECRET must be >= 32 bytes. If unset, a random one is generated at startup
# (dev only: tokens stop working after a restart and across multiple instances).
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-days=7

# Opt-in demo events (only inserted when the events table is empty). Keep false in production.
app.seed.demo-data=${SEED_DEMO_DATA:false}

# CORS: comma-separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Never leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never

springdoc.swagger-ui.path=/swagger-ui.html
