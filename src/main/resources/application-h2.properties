# Local no-database mode: in-memory H2, no password needed. Data is lost on every restart.
# Activate with: spring.profiles.active=h2   (use MySQL for anything real)
spring.datasource.url=jdbc:h2:mem:campulse;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
